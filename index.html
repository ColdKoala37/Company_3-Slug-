<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slug</title>

  <!-- How the app looks once it is on the Home Screen -->
  <meta name="apple-mobile-web-app-title" content="Slug">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#b9eae4">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    :root { --mint: #ccfedf; --ink: #1f5a46; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--mint);
      touch-action: pan-x pan-y; /* swiping only, no pinch-zooming the whole app */
    }
    body {
      position: fixed;
      inset: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button {
      appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* The app keeps the 3:4 shape of the pictures. It fills a portrait iPad or iPhone;
       on wider screens it becomes a centred column over a soft blur of the current screen. */
    .app {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: min(100%, 75vh);
      width: min(100%, 75dvh);
      overflow: hidden;
      background: var(--mint);
    }
    .backdrop {
      position: fixed;
      inset: -80px;
      background: var(--mint) center / cover no-repeat;
      filter: blur(40px) saturate(1.1);
      opacity: 0.9;
    }
    @media (max-aspect-ratio: 3/4) { .backdrop { display: none; } }
    @media (min-aspect-ratio: 3/4) { .app { box-shadow: 0 0 0 1px rgb(31 90 70 / 0.06), 0 20px 60px rgb(31 90 70 / 0.25); } }

    /* ---------- Screens ---------- */
    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      z-index: 0;
    }
    .screen.leaving { opacity: 1; visibility: visible; z-index: 1; }
    .screen.active  { opacity: 1; visibility: visible; z-index: 2; animation: fade-in .28s ease both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* Each picture sits at full width in the middle; the soft bands above and below
       are part of the image, so it also fills taller screens */
    .picture {
      background:
        var(--img) center / 100% auto no-repeat,
        linear-gradient(var(--top) 50%, var(--bottom) 50%);
    }
    /* The picture's own 1024 x 1366 area, where its buttons are */
    .stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      aspect-ratio: 1024 / 1366;
      container-type: inline-size;
    }
    /* Tap areas, positioned in the picture's own pixels */
    .hot {
      position: absolute;
      left:   calc(var(--x) * 100cqw / 1024);
      top:    calc(var(--y) * 100cqw / 1024);
      width:  calc(var(--w) * 100cqw / 1024);
      height: calc(var(--h) * 100cqw / 1024);
      border-radius: calc(var(--r, 28) * 100cqw / 1024);
    }
    .hot:active { background: rgb(255 255 255 / 0.2); }

    /* Loading: the ring of slugs turns slowly */
    .ring {
      position: absolute;
      left:  calc(321.3 * 100cqw / 1024);
      top:   calc(438.1 * 100cqw / 1024);
      width: calc(384 * 100cqw / 1024);
      height: calc(384 * 100cqw / 1024);
      animation: spin 2.8s linear infinite;
    }
    .screen:not(.active) .ring { animation-play-state: paused; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Map ---------- */
    .map {
      position: absolute;
      inset: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
      scrollbar-width: none;
      background: var(--mint);
    }
    .map::-webkit-scrollbar { display: none; }
    .world {
      position: relative;
      display: inline-block;
      height: 100%;
      vertical-align: top;
    }
    .world > img {
      display: block;
      height: 100%;
      width: auto;
      max-width: none;
      -webkit-user-drag: none;
    }
    /* Tap areas over the labels, in pixels of the 3606 x 1846 map */
    .spot {
      position: absolute;
      left:   calc(var(--x) / 3606 * 100%);
      top:    calc(var(--y) / 1846 * 100%);
      width:  calc(var(--w) / 3606 * 100%);
      height: calc(var(--h) / 1846 * 100%);
      border-radius: 999px;
    }
    .spot:active { background: rgb(255 255 255 / 0.22); }

    /* ---------- Phone turned sideways ---------- */
    .rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: var(--mint);
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }
    .rotate p { margin: 0; }
    @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
      .rotate { display: grid; }
    }

    @media (pointer: fine) {
      .map { cursor: grab; }
      .map.dragging { cursor: grabbing; }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <main class="app">

    <!-- Start -->
    <section class="screen picture active" id="splash" data-theme="#b9eae4"
             style="--img: url(splash.webp); --top: #b9eae4; --bottom: #65ac8a">
      <div class="stage">
        <button class="hot" data-go="age" aria-label="Let's go" style="--x:298; --y:1108; --w:434; --h:158; --r:79"></button>
      </div>
    </section>

    <!-- How old is your child? -->
    <section class="screen picture" id="age" data-theme="#ceffda"
             style="--img: url(age.webp); --top: #ceffda; --bottom: #ceffda">
      <div class="stage">
        <button class="hot" data-go="map" aria-label="4 to 6 years"   style="--x:243; --y:413; --w:251; --h:241; --r:56"></button>
        <button class="hot" data-go="map" aria-label="6 to 8 years"   style="--x:530; --y:413; --w:251; --h:241; --r:56"></button>
        <button class="hot" data-go="map" aria-label="8 to 10 years"  style="--x:243; --y:712; --w:251; --h:241; --r:56"></button>
        <button class="hot" data-go="map" aria-label="10 to 12 years" style="--x:530; --y:712; --w:251; --h:241; --r:56"></button>
      </div>
    </section>

    <!-- The map: swipe left and right, tap a label -->
    <section class="screen" id="map" data-theme="#ccfedf" style="--img: url(map.webp)">
      <div class="map" id="scroller">
        <div class="world">
          <img src="map.webp" width="3606" height="1846" draggable="false" fetchpriority="high"
               alt="Town map with labels for My Profile, Simon Says, Battleship Ducks and Garbage Sudoku">
          <button class="spot" data-go="profile" aria-label="My Profile"       style="--x:16;   --y:5;    --w:761; --h:229"></button>
          <button class="spot" data-go="simon"   aria-label="Simon Says"       style="--x:866;  --y:513;  --w:589; --h:202" data-loading></button>
          <button class="spot" data-go="battle"  aria-label="Battleship Ducks" style="--x:2071; --y:412;  --w:593; --h:187" data-loading></button>
          <button class="spot" data-go="sudoku"  aria-label="Garbage Sudoku"   style="--x:2171; --y:1459; --w:680; --h:208" data-loading></button>
        </div>
      </div>
    </section>

    <!-- Loading (between the map and a game) -->
    <section class="screen picture" id="loading" data-theme="#ceffda"
             style="--img: url(loading.webp); --top: #ceffda; --bottom: #ceffda">
      <div class="stage">
        <img class="ring" src="ring.webp" alt="">
      </div>
    </section>

    <!-- Games (pictures for now; the map button takes you back) -->
    <section class="screen picture" id="simon" data-theme="#f9db73"
             style="--img: url(simon.webp); --top: #f9db73; --bottom: #7992a0">
      <div class="stage">
        <button class="hot" data-go="map" data-loading aria-label="Back to the map" style="--x:0; --y:1225; --w:146; --h:141"></button>
      </div>
    </section>

    <section class="screen picture" id="battle" data-theme="#c5f2e3"
             style="--img: url(battle.webp); --top: #c5f2e3; --bottom: #62c8e4">
      <div class="stage">
        <button class="hot" data-go="map" data-loading aria-label="Back to the map" style="--x:40; --y:1150; --w:155; --h:150; --r:75"></button>
      </div>
    </section>

    <section class="screen picture" id="sudoku" data-theme="#a2e7fd"
             style="--img: url(sudoku.webp); --top: #a2e7fd; --bottom: #74d498">
      <div class="stage">
        <button class="hot" data-go="map" data-loading aria-label="Back to the map" style="--x:0; --y:1225; --w:146; --h:141"></button>
      </div>
    </section>

    <!-- My Profile -->
    <section class="screen picture" id="profile" data-theme="#caf8da"
             style="--img: url(profile.webp); --top: #caf8da; --bottom: #99e3bd">
      <div class="stage">
        <button class="hot" data-go="settings" aria-label="Settings" style="--x:869; --y:19;   --w:145; --h:145; --r:73"></button>
        <button class="hot" data-go="map"      aria-label="Save"     style="--x:344; --y:1175; --w:350; --h:143; --r:72"></button>
      </div>
    </section>

    <!-- Settings -->
    <section class="screen picture" id="settings" data-theme="#93f4ad"
             style="--img: url(settings.webp); --top: #93f4ad; --bottom: #93f4ad">
      <div class="stage">
        <button class="hot" data-go="map"  aria-label="Back to the map" style="--x:0;   --y:1225; --w:146; --h:141"></button>
        <button class="hot" data-go="back" aria-label="Back"            style="--x:867; --y:1226; --w:157; --h:140"></button>
      </div>
    </section>

  </main>

  <div class="rotate" aria-hidden="true">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2.5" width="10" height="19" rx="2.5"/>
      <path d="M11 18.5h2"/>
    </svg>
    <p>Turn your phone upright</p>
  </div>

  <script>
    const LOADING_TIME = 1600; // how long the loading screen shows, in milliseconds

    const screens = {};
    document.querySelectorAll('.screen').forEach(s => { screens[s.id] = s; });
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const backdrop = document.getElementById('backdrop');
    let current = 'splash';
    let cameFrom = 'map';
    let busy = false;

    // Fade the next screen in on top of the current one
    function show(id) {
      const prev = screens[current], next = screens[id];
      if (prev === next) return;
      if (current !== 'loading') cameFrom = current;
      prev.classList.remove('active');
      prev.classList.add('leaving');
      clearTimeout(prev.leaveTimer);
      prev.leaveTimer = setTimeout(() => prev.classList.remove('leaving'), 320);
      next.classList.add('active');
      current = id;
      themeColor.setAttribute('content', next.dataset.theme);
      backdrop.style.backgroundImage = next.style.getPropertyValue('--img');
    }

    function go(target, withLoading) {
      if (target === 'back') target = cameFrom;
      if (busy || target === current) return;
      if (!withLoading) { show(target); return; }
      busy = true;
      show('loading');
      setTimeout(() => { show(target); busy = false; }, LOADING_TIME);
    }

    document.addEventListener('click', e => {
      const button = e.target.closest('[data-go]');
      if (button) go(button.dataset.go, button.hasAttribute('data-loading'));
    });
    backdrop.style.backgroundImage = screens.splash.style.getPropertyValue('--img');

    // ---------- Map ----------
    // It opens at the left edge (My Profile and Simon Says) and keeps the same spot in view
    // when the screen size changes
    const scroller = document.getElementById('scroller');
    let spot = 0, lastWidth = 0, lastScrollWidth = 0;
    const room = () => scroller.scrollWidth - scroller.clientWidth;
    function layoutMap() {
      scroller.scrollLeft = spot * room();
      lastWidth = scroller.clientWidth;
      lastScrollWidth = scroller.scrollWidth;
    }
    scroller.addEventListener('scroll', () => {
      if (scroller.clientWidth !== lastWidth || scroller.scrollWidth !== lastScrollWidth) return;
      if (room() > 0) spot = scroller.scrollLeft / room();
    }, { passive: true });
    addEventListener('resize', layoutMap);
    scroller.querySelector('img').addEventListener('load', layoutMap);
    layoutMap();

    // Computer: drag the map with the mouse (a drag doesn't count as a tap on a label)
    let drag = null, dragged = false;
    scroller.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      drag = { x: e.clientX, left: scroller.scrollLeft, id: e.pointerId, moving: false };
      dragged = false;
    });
    scroller.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (!drag.moving && Math.abs(dx) > 5) {
        drag.moving = true;
        scroller.setPointerCapture(drag.id);
        scroller.classList.add('dragging');
      }
      if (drag.moving) scroller.scrollLeft = drag.left - dx;
    });
    const endDrag = () => {
      if (drag && drag.moving) dragged = true;
      drag = null;
      scroller.classList.remove('dragging');
    };
    scroller.addEventListener('pointerup', endDrag);
    scroller.addEventListener('pointercancel', endDrag);
    scroller.addEventListener('click', e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; }
    }, true);

    // Stop a pinch from zooming the whole app
    for (const type of ['gesturestart', 'gesturechange']) {
      document.addEventListener(type, e => e.preventDefault(), { passive: false });
    }

    // Load every picture up front so screens switch instantly
    ['age', 'loading', 'ring', 'simon', 'battle', 'sudoku', 'profile', 'settings']
      .forEach(n => { new Image().src = n + '.webp'; });

    // Lets the app open without internet (see sw.js)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
