<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slug</title>

  <!-- How the app looks once it is on the Home Screen -->
  <meta name="apple-mobile-web-app-title" content="Slug">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#b9eae4">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    :root { --mint: #ccfedf; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--mint);
      touch-action: pan-x pan-y; /* swiping only, no pinch-zooming the whole app */
    }
    body {
      position: fixed;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button {
      appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    img {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    /* ---------- Screens ---------- */
    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      z-index: 0;
      container-type: size;
    }
    .screen.leaving { opacity: 1; visibility: visible; z-index: 1; }
    .screen.active  { opacity: 1; visibility: visible; z-index: 2; animation: fade-in .28s ease both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* Your picture is shown whole, in its own shape, as large as the screen allows.
       Any space left over is a plain colour taken from the picture's top and bottom edge. */
    .picture { background: linear-gradient(var(--top) 50%, var(--bottom) 50%); }
    @media (min-aspect-ratio: 3/4) { .picture { background: var(--mint); } }

    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(100cqw, 100cqh * 1024 / 1366);
      aspect-ratio: 1024 / 1366;
      container-type: inline-size;
    }
    .stage > img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Tap areas, positioned in the picture's own pixels (1024 x 1366) */
    .hot {
      position: absolute;
      left:   calc(var(--x) * 100cqw / 1024);
      top:    calc(var(--y) * 100cqw / 1024);
      width:  calc(var(--w) * 100cqw / 1024);
      height: calc(var(--h) * 100cqw / 1024);
      border-radius: calc(var(--r, 28) * 100cqw / 1024);
    }
    .hot:active { background: rgb(255 255 255 / 0.2); }

    /* ---------- Map ---------- */
    .map {
      position: absolute;
      inset: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
      scrollbar-width: none;
      background: var(--mint);
    }
    .map::-webkit-scrollbar { display: none; }
    .world {
      position: relative;
      display: inline-block;
      height: 100%;
      vertical-align: top;
    }
    .world > img {
      display: block;
      height: 100%;
      width: auto;
      max-width: none;
    }
    /* Tap areas over the labels, in pixels of the 3606 x 1846 map */
    .spot {
      position: absolute;
      left:   calc(var(--x) / 3606 * 100%);
      top:    calc(var(--y) / 1846 * 100%);
      width:  calc(var(--w) / 3606 * 100%);
      height: calc(var(--h) / 1846 * 100%);
      border-radius: 999px;
    }
    .spot:active { background: rgb(255 255 255 / 0.22); }

    /* ---------- Phone turned sideways ---------- */
    .rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: var(--mint);
      color: #1f5a46;
      font: 600 17px -apple-system, system-ui, sans-serif;
      text-align: center;
    }
    .rotate p { margin: 0; }
    @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
      .rotate { display: grid; }
    }

    @media (pointer: fine) {
      .map { cursor: grab; }
      .map.dragging { cursor: grabbing; }
    }
  </style>
</head>
<body>

  <!-- Start -->
  <section class="screen picture active" id="splash" data-theme="#b9eae4" style="--top:#b9eae4; --bottom:#63ac8a">
    <div class="stage">
      <img src="splash.png" width="1024" height="1366" alt="Slug">
      <button class="hot" data-go="age" aria-label="Let's go" style="--x:298; --y:1108; --w:434; --h:158; --r:79"></button>
    </div>
  </section>

  <!-- How old is your child? -->
  <section class="screen picture" id="age" data-theme="#ceffda" style="--top:#ceffda; --bottom:#ceffda">
    <div class="stage">
      <img src="age.png" width="1024" height="1366" alt="How old is your child?">
      <button class="hot" data-go="map" aria-label="4 to 6 years"   style="--x:243; --y:413; --w:251; --h:241; --r:56"></button>
      <button class="hot" data-go="map" aria-label="6 to 8 years"   style="--x:530; --y:413; --w:251; --h:241; --r:56"></button>
      <button class="hot" data-go="map" aria-label="8 to 10 years"  style="--x:243; --y:712; --w:251; --h:241; --r:56"></button>
      <button class="hot" data-go="map" aria-label="10 to 12 years" style="--x:530; --y:712; --w:251; --h:241; --r:56"></button>
    </div>
  </section>

  <!-- The map: swipe left and right, tap a label -->
  <section class="screen" id="map" data-theme="#ccfedf">
    <div class="map" id="scroller">
      <div class="world">
        <img src="map.png" width="3606" height="1846" draggable="false"
             alt="Town map with labels for My Profile, Simon Says, Battleship Ducks and Garbage Sudoku">
        <button class="spot" data-go="profile" aria-label="My Profile"       style="--x:16;   --y:5;    --w:761; --h:229"></button>
        <button class="spot" data-go="simon"   aria-label="Simon Says"       style="--x:866;  --y:513;  --w:589; --h:202"></button>
        <button class="spot" data-go="battle"  aria-label="Battleship Ducks" style="--x:2071; --y:412;  --w:593; --h:187"></button>
        <button class="spot" data-go="sudoku"  aria-label="Garbage Sudoku"   style="--x:2171; --y:1459; --w:680; --h:208"></button>
      </div>
    </div>
  </section>

  <!-- Games (pictures for now; the map button takes you back) -->
  <section class="screen picture" id="simon" data-theme="#f9db73" style="--top:#f9db73; --bottom:#7992a0">
    <div class="stage">
      <img src="simon.png" width="1024" height="1366" alt="Simon Says">
      <button class="hot" data-go="map" aria-label="Back to the map" style="--x:0; --y:1225; --w:146; --h:141"></button>
    </div>
  </section>

  <section class="screen picture" id="battle" data-theme="#c3f2e2" style="--top:#c3f2e2; --bottom:#64c8e3">
    <div class="stage">
      <img src="battle.png" width="1024" height="1366" alt="Battleship Ducks">
      <button class="hot" data-go="map" aria-label="Back to the map" style="--x:40; --y:1150; --w:155; --h:150; --r:75"></button>
    </div>
  </section>

  <section class="screen picture" id="sudoku" data-theme="#a2e7fd" style="--top:#a2e7fd; --bottom:#71d397">
    <div class="stage">
      <img src="sudoku.png" width="1024" height="1366" alt="Color Sudoku">
      <button class="hot" data-go="map" aria-label="Back to the map" style="--x:0; --y:1225; --w:146; --h:141"></button>
    </div>
  </section>

  <!-- My Profile -->
  <section class="screen picture" id="profile" data-theme="#caf8da" style="--top:#caf8da; --bottom:#9ae4be">
    <div class="stage">
      <img src="profile.png" width="1024" height="1366" alt="My Profile">
      <button class="hot" data-go="settings" aria-label="Settings" style="--x:869; --y:19;   --w:145; --h:145; --r:73"></button>
      <button class="hot" data-go="map"      aria-label="Save"     style="--x:344; --y:1175; --w:350; --h:143; --r:72"></button>
    </div>
  </section>

  <!-- Settings -->
  <section class="screen picture" id="settings" data-theme="#93f4ad" style="--top:#93f4ad; --bottom:#93f4ad">
    <div class="stage">
      <img src="settings.png" width="1024" height="1366" alt="Settings">
      <button class="hot" data-go="map"  aria-label="Back to the map" style="--x:0;   --y:1225; --w:146; --h:141"></button>
      <button class="hot" data-go="back" aria-label="Back"            style="--x:867; --y:1226; --w:157; --h:140"></button>
    </div>
  </section>

  <div class="rotate" aria-hidden="true">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2.5" width="10" height="19" rx="2.5"/>
      <path d="M11 18.5h2"/>
    </svg>
    <p>Turn your phone upright</p>
  </div>

  <script>
    const screens = {};
    document.querySelectorAll('.screen').forEach(s => { screens[s.id] = s; });
    const themeColor = document.querySelector('meta[name="theme-color"]');
    let current = 'splash';
    let cameFrom = 'map';

    // Fade the next screen in on top of the current one
    function show(id) {
      const prev = screens[current], next = screens[id];
      if (!next || prev === next) return;
      cameFrom = current;
      prev.classList.remove('active');
      prev.classList.add('leaving');
      clearTimeout(prev.leaveTimer);
      prev.leaveTimer = setTimeout(() => prev.classList.remove('leaving'), 320);
      next.classList.add('active');
      current = id;
      themeColor.setAttribute('content', next.dataset.theme);
    }

    document.addEventListener('click', e => {
      const button = e.target.closest('[data-go]');
      if (!button) return;
      const target = button.dataset.go;
      show(target === 'back' ? cameFrom : target);
    });

    // ---------- Map ----------
    // It opens at the left edge (My Profile and Simon Says) and keeps the same spot in view
    // when the screen size changes
    const scroller = document.getElementById('scroller');
    let spot = 0, lastWidth = 0, lastScrollWidth = 0;
    const room = () => scroller.scrollWidth - scroller.clientWidth;
    function layoutMap() {
      scroller.scrollLeft = spot * room();
      lastWidth = scroller.clientWidth;
      lastScrollWidth = scroller.scrollWidth;
    }
    scroller.addEventListener('scroll', () => {
      if (scroller.clientWidth !== lastWidth || scroller.scrollWidth !== lastScrollWidth) return;
      if (room() > 0) spot = scroller.scrollLeft / room();
    }, { passive: true });
    addEventListener('resize', layoutMap);
    scroller.querySelector('img').addEventListener('load', layoutMap);
    layoutMap();

    // Computer: drag the map with the mouse (a drag doesn't count as a tap on a label)
    let drag = null, dragged = false;
    scroller.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      drag = { x: e.clientX, left: scroller.scrollLeft, id: e.pointerId, moving: false };
      dragged = false;
    });
    scroller.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (!drag.moving && Math.abs(dx) > 5) {
        drag.moving = true;
        scroller.setPointerCapture(drag.id);
        scroller.classList.add('dragging');
      }
      if (drag.moving) scroller.scrollLeft = drag.left - dx;
    });
    const endDrag = () => {
      if (drag && drag.moving) dragged = true;
      drag = null;
      scroller.classList.remove('dragging');
    };
    scroller.addEventListener('pointerup', endDrag);
    scroller.addEventListener('pointercancel', endDrag);
    scroller.addEventListener('click', e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; }
    }, true);

    // Stop a pinch from zooming the whole app
    for (const type of ['gesturestart', 'gesturechange']) {
      document.addEventListener(type, e => e.preventDefault(), { passive: false });
    }

    // Lets the app open without internet (see sw.js)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
