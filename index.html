<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slug</title>

  <!-- How the app looks once it is on the Home Screen -->
  <meta name="apple-mobile-web-app-title" content="Slug">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#b7ebe4">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="slug-icon.png">
  <link rel="icon" type="image/png" href="slug-icon.png">

  <style>
    :root { --mint: #ccfedf; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--mint);
      touch-action: pan-x pan-y; /* swiping only, no pinch-zooming the whole app */
    }
    body {
      position: fixed;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button {
      appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    img {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    /* ---------- Screens ---------- */
    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      z-index: 0;
      container-type: size;
    }
    .screen.leaving { opacity: 1; visibility: visible; z-index: 1; }
    .screen.active  { opacity: 1; visibility: visible; z-index: 2; animation: fade-in .28s ease both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* Your picture is shown whole, in its own shape, as large as the screen allows.
       Any space left over is a plain colour taken from the picture's top and bottom edge. */
    .picture { background: linear-gradient(var(--top) 50%, var(--bottom) 50%); }
    @media (min-aspect-ratio: 3/4) { .picture { background: var(--mint); } }

    /* --iw and --ih are the picture's own width and height in pixels */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(100cqw, 100cqh * var(--iw) / var(--ih));
      aspect-ratio: var(--iw) / var(--ih);
      container-type: inline-size;
    }
    .stage > img.pic {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Tap areas and placed pictures, positioned in the picture's own pixels */
    .hot, .part {
      position: absolute;
      left:   calc(var(--x) * 100cqw / var(--iw));
      top:    calc(var(--y) * 100cqw / var(--iw));
      width:  calc(var(--w) * 100cqw / var(--iw));
      height: calc(var(--h) * 100cqw / var(--iw));
      border-radius: calc(var(--r, 28) * 100cqw / var(--iw));
    }
    .part { pointer-events: none; }
    .hot:active { background: rgb(255 255 255 / 0.2); }

    /* ---------- Map ---------- */
    .map {
      position: absolute;
      inset: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
      scrollbar-width: none;
      background: var(--mint);
    }
    .map::-webkit-scrollbar { display: none; }
    .world {
      position: relative;
      display: inline-block;
      height: 100%;
      aspect-ratio: 3606 / 1846;   /* the shape of your map */
      vertical-align: top;
    }
    /* Tap areas over the labels, in pixels of the 3606 x 1846 map */
    .spot {
      position: absolute;
      left:   calc(var(--x) / 3606 * 100%);
      top:    calc(var(--y) / 1846 * 100%);
      width:  calc(var(--w) / 3606 * 100%);
      height: calc(var(--h) / 1846 * 100%);
      border-radius: 999px;
    }
    .spot:active { background: rgb(255 255 255 / 0.22); }

    /* ---------- The map comes to life ----------
       Your map and everything on it is laid out in pixels of the 3606 x 1846 map, then scaled to the screen in one go. */
    .life {
      position: absolute;
      left: 0;
      top: 0;
      width: 3606px;
      height: 1846px;
      transform-origin: 0 0;
      transform: scale(var(--k, .5));
      pointer-events: none;
      overflow: hidden;
    }
    .life .bit, .life .box {
      position: absolute;
      left: calc(var(--x) * 1px);
      top: calc(var(--y) * 1px);
      width: calc(var(--w) * 1px);
      height: calc(var(--h) * 1px);
    }
    .life .box > img { display: block; width: 100%; height: 100%; }
    /* paused while you are on another screen; with Reduce Motion switched on, your map stays exactly as it is */
    .life.paused *, .life.paused *::before, .life.paused *::after { animation-play-state: paused !important; }
    .life.calm *, .life.calm *::before, .life.calm *::after { animation: none !important; }
    .life.calm .ifill, .life.calm .hang { visibility: hidden; }
    /* the spot where a vehicle was parked only shows once it drives off */
    .life .vfill { opacity: 0; transition: opacity .6s; }
    .life.go .vfill { opacity: 1; }

    /* Vehicles: placed by the script below, wheels on the road */
    .mover {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .mover img { position: absolute; display: block; }
    .life .label { z-index: 5000; }

    /* Waterfall: water runs down, the splash bounces, drops jump */
    .falls { overflow: hidden; border-radius: 40px 60px 0 0; }
    .falls i {
      position: absolute;
      top: -60px;
      left: calc(var(--l) * 1px);
      width: 5px;
      height: 46px;
      border-radius: 3px;
      background: linear-gradient(rgb(255 255 255 / 0), rgb(255 255 255 / .75) 50%, rgb(255 255 255 / 0));
      animation: fall 1.25s linear infinite;
      animation-delay: var(--d);
    }
    @keyframes fall {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(215px); opacity: 0; }
    }
    .splash { transform-origin: 50% 92%; animation: splash .9s ease-in-out infinite; }
    @keyframes splash {
      0%, 100% { transform: scale(1, 1); }
      35% { transform: scale(1.06, 1.16); }
      70% { transform: scale(.97, .93); }
    }
    .drops i {
      position: absolute;
      left: calc(var(--x) * 1px);
      top: calc(var(--y) * 1px);
      width: calc(var(--s) * 1px);
      height: calc(var(--s) * 1px);
      border-radius: 50%;
      background: #fff;
      animation: drop 1.1s cubic-bezier(.3, .6, .6, 1) infinite;
      animation-delay: var(--d);
      opacity: 0;
    }
    @keyframes drop {
      0% { transform: translate(0, 0) scale(.6); opacity: 0; }
      12% { opacity: 1; }
      45% { transform: translate(calc(var(--dx) * .55px), -26px) scale(1); }
      90% { opacity: 1; }
      100% { transform: translate(calc(var(--dx) * 1px), 10px) scale(.7); opacity: 0; }
    }

    /* Flag: your flag, in thin strips that wave one after the other */
    .flag i {
      position: absolute;
      top: 0;
      left: calc(var(--i) * 2px);
      width: 2.5px;
      height: 30px;
      background: url(map-flag.png) no-repeat;
      background-size: 50px 30px;
      background-position: calc(var(--i) * -2px) 0;
      animation: wave 1.3s ease-in-out infinite;
      animation-delay: calc(var(--i) * -.052s);
    }
    @keyframes wave {
      0%, 100% { transform: translateY(calc(var(--a) * -1px)) scaleY(1); }
      50% { transform: translateY(calc(var(--a) * 1px)) scaleY(.96); }
    }

    /* Butterfly: flaps its wings towards its body, a few times, then glides */
    .fly { animation: hover 3.2s ease-in-out infinite; }
    @keyframes hover { 50% { transform: translate(3px, -5px) rotate(3deg); } }
    .fly img {
      transform-origin: 54% 62%;
      animation: flap 2.2s linear infinite;
    }
    @keyframes flap {
      0%, 60%, 100% { transform: rotate(-20deg) scaleX(1) rotate(20deg); }
      7.5%, 22.5%, 37.5%, 52.5% { transform: rotate(-20deg) scaleX(.25) rotate(20deg); }
      15%, 30%, 45% { transform: rotate(-20deg) scaleX(1) rotate(20deg); }
    }

    /* Boat: sails up and down the lake and rocks on the waves */
    .boat { animation: sail 48s ease-in-out infinite; }
    .boat > div { width: 100%; height: 100%; transform-origin: 50% 90%; animation: rock 3.4s ease-in-out infinite alternate; }
    .boat img { display: block; width: 100%; height: 100%; }
    @keyframes sail {
      0% { transform: translateX(0) scaleX(1); }
      15% { transform: translateX(-28px) scaleX(1); }
      19% { transform: translateX(-28px) scaleX(-1); }
      57% { transform: translateX(150px) scaleX(-1); }
      61% { transform: translateX(150px) scaleX(1); }
      100% { transform: translateX(0) scaleX(1); }
    }
    @keyframes rock { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(3deg) translateY(2px); } }

    /* Fisherman: now and then the line jerks, the rod pulls up a fish, and the fish jumps back in */
    .rod { transform-origin: 7px 92px; }                       /* the reel, in the rod picture */
    .rod > img { display: block; width: 100%; height: 100%; }
    .rod .hang { position: absolute; left: 77px; top: 2px; width: 4px; transform-origin: 2px 0; }
    .rod .line { position: absolute; left: 0; top: 0; width: 3px; height: 107px; border-radius: 2px; background: rgb(255 255 255 / .95); }
    .rod .fish {
      position: absolute;
      left: -45px;
      top: 85px;
      width: 60px;
      height: 40px;
      opacity: 0;
      transform-origin: 77% 55%;
      transform: rotate(-80deg);
    }
    .ripple {
      position: absolute;
      left: calc(var(--x) * 1px);
      top: calc(var(--y) * 1px);
      width: 46px;
      height: 14px;
      margin: -7px 0 0 -23px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2.5px rgb(255 255 255 / .9);
      opacity: 0;
    }
    .fisher.catch .rod { animation: rod-catch 4.4s ease-in-out both; }
    .fisher.catch .hang { animation: hang-catch 4.4s ease-in-out both; }
    .fisher.catch .line { animation: line-catch 4.4s ease-in-out both; }
    .fisher.catch .fish { animation: fish-catch 4.4s ease-in-out both; }
    .fisher.catch .ripple.a { animation: ripple 4.4s ease-out both; }
    .fisher.catch .ripple.b { animation: ripple-b 4.4s ease-out both; }
    @keyframes rod-catch {
      0%, 100% { transform: rotate(0); }
      8% { transform: rotate(4deg); } 14% { transform: rotate(0); }
      20% { transform: rotate(5deg); } 26% { transform: rotate(0); }
      33% { transform: rotate(-19deg); }
      40% { transform: rotate(-16deg); } 47% { transform: rotate(-19deg); } 54% { transform: rotate(-16deg); } 61% { transform: rotate(-19deg); }
      70% { transform: rotate(-17deg); }
      86% { transform: rotate(0); }
    }
    @keyframes hang-catch {
      0%, 100% { transform: rotate(0); }
      8% { transform: rotate(-4deg); } 14% { transform: rotate(0); }
      20% { transform: rotate(-5deg); } 26% { transform: rotate(0); }
      33% { transform: rotate(19deg); }
      40% { transform: rotate(16deg); } 47% { transform: rotate(19deg); } 54% { transform: rotate(16deg); } 61% { transform: rotate(19deg); }
      70% { transform: rotate(17deg); }
      86% { transform: rotate(0); }
    }
    @keyframes line-catch {
      0%, 26%, 86%, 100% { height: 107px; }
      8% { height: 113px; } 20% { height: 115px; }
      33%, 72% { height: 52px; }
    }
    @keyframes fish-catch {
      0%, 30% { top: 85px; opacity: 0; transform: rotate(-80deg); }
      33% { top: 30px; opacity: 1; transform: rotate(-95deg); }
      38% { transform: rotate(-62deg); } 43% { transform: rotate(-100deg); } 48% { transform: rotate(-60deg); }
      53% { transform: rotate(-98deg); } 58% { transform: rotate(-64deg); } 63% { transform: rotate(-96deg); }
      70% { top: 30px; opacity: 1; transform: rotate(-70deg); }
      78% { top: 96px; opacity: 1; transform: rotate(40deg); }
      80%, 100% { top: 110px; opacity: 0; transform: rotate(60deg); }
    }
    @keyframes ripple {
      0%, 4% { opacity: 0; transform: scale(.4); }
      9% { opacity: 1; } 18% { opacity: 0; transform: scale(1.6); }
      19% { opacity: 0; transform: scale(.4); } 22% { opacity: 1; } 31% { opacity: 0; transform: scale(1.7); }
      100% { opacity: 0; }
    }
    @keyframes ripple-b {
      0%, 78% { opacity: 0; transform: scale(.4); }
      81% { opacity: 1; }
      96%, 100% { opacity: 0; transform: scale(2.1); }
    }

    /* ---------- Shared by the three games ---------- */
    @font-face {
      font-family: 'Nunito';
      src: url(nunito.woff2) format('woff2');
      font-weight: 200 1000;
      font-display: swap;
    }
    .game {
      --px: calc(100cqw / 1024);   /* 1/1024 of your picture's width */
      touch-action: none;
      font-family: 'Nunito', ui-rounded, system-ui, sans-serif;
    }
    /* A placed area in picture pixels that does not light up when pressed */
    .area {
      position: absolute;
      left:   calc(var(--x) * 100cqw / var(--iw));
      top:    calc(var(--y) * 100cqw / var(--iw));
      width:  calc(var(--w) * 100cqw / var(--iw));
      height: calc(var(--h) * 100cqw / var(--iw));
      border-radius: calc(var(--r, 0) * 100cqw / var(--iw));
    }

    /* Level number and dots, plus a short message in Slug Says and Battleship Ducks */
    .pill {
      position: absolute;
      left: calc(var(--x) * var(--px));
      top: calc(var(--y) * var(--px));
      transform: translateX(-50%);
      box-sizing: border-box;
      min-width: calc(var(--w, 0) * var(--px));
      height: calc(var(--h, 44) * var(--px));
      padding: 0 calc(24 * var(--px));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(16 * var(--px));
      white-space: nowrap;
      border-radius: 999px;
      background: rgb(255 255 255 / .94);
      box-shadow: 0 calc(4 * var(--px)) calc(12 * var(--px)) rgb(36 75 131 / .18);
      color: #244b83;
      font-weight: 800;
      font-size: calc(25 * var(--px));
      line-height: 1;
      pointer-events: none;
    }
    .pill b { font-weight: 900; }
    .dots { display: flex; gap: calc(8 * var(--px)); }
    .dots i { width: calc(16 * var(--px)); height: calc(16 * var(--px)); border-radius: 50%; background: #d3e6f5; }
    .dots i.done { background: #fdd45e; box-shadow: inset 0 0 0 calc(2 * var(--px)) #e9b93a; }
    .dots i.now { background: #2e96f9; }
    .say {
      padding-left: calc(16 * var(--px));
      border-left: calc(3 * var(--px)) solid #d3e6f5;
      font-weight: 900;
    }
    .say:empty { display: none; }
    .say.pop { animation: say-pop .32s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes say-pop { from { transform: scale(1.25); } to { transform: scale(1); } }
    .pill.shake { animation: pill-shake .4s ease-in-out; }
    @keyframes pill-shake {
      0%, 100% { transform: translateX(-50%); }
      25% { transform: translateX(calc(-50% - 10 * var(--px))); }
      75% { transform: translateX(calc(-50% + 10 * var(--px))); }
    }

    /* "Great job!" card (and the "Start" card in Slug Says and Battleship Ducks) */
    .veil {
      position: absolute;
      left: calc(var(--x) * var(--px));
      top: calc(var(--y) * var(--px));
      width: calc(var(--w) * var(--px));
      height: calc(var(--h) * var(--px));
      border-radius: calc(44 * var(--px));
      background: rgb(255 255 255 / .35);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, visibility .25s;
      pointer-events: none;
    }
    .card {
      position: absolute;
      left: calc(212 * var(--px));
      top: calc(var(--y, 486) * var(--px));
      width: calc(600 * var(--px));
      box-sizing: border-box;
      padding: calc(44 * var(--px)) calc(40 * var(--px)) calc(50 * var(--px));
      border-radius: calc(56 * var(--px));
      background: #fff;
      text-align: center;
      box-shadow: 0 0 0 calc(8 * var(--px)) rgb(255 255 255 / .6), 0 calc(24 * var(--px)) calc(60 * var(--px)) rgb(36 75 131 / .35);
      opacity: 0;
      visibility: hidden;
      transform: scale(.85);
      transition: opacity .25s, visibility .25s, transform .35s cubic-bezier(.3, 1.5, .5, 1);
    }
    .game.won .veil, .game.won .card { opacity: 1; visibility: visible; }
    .game.won .card { transform: scale(1); }
    .card p { margin: 0; }
    .card-title { color: #244b83; font-weight: 900; font-size: calc(68 * var(--px)); line-height: 1.05; }
    .card p.card-text { margin-top: calc(14 * var(--px)); color: #2f558c; font-weight: 700; font-size: calc(34 * var(--px)); line-height: 1.2; }
    .card-button {
      margin-top: calc(38 * var(--px));
      display: inline-flex;
      align-items: center;
      gap: calc(14 * var(--px));
      height: calc(104 * var(--px));
      padding: 0 calc(56 * var(--px));
      border-radius: 999px;
      background: #fdd45e;
      color: #304257;
      font: 900 calc(40 * var(--px)) / 1 'Nunito', ui-rounded, system-ui, sans-serif;
      box-shadow: 0 0 0 calc(7 * var(--px)) #fafbf4, 0 calc(12 * var(--px)) calc(22 * var(--px)) rgb(48 66 87 / .28);
    }
    .card-button svg { width: calc(40 * var(--px)); height: calc(40 * var(--px)); }
    .card-button:active { transform: scale(.96); }

    /* ---------- Colour Sudoku ---------- */
    /* Each cell shows a piece of your picture: an empty slot, or a bin on a plain tile */
    .sdk-cell {
      position: absolute;
      left:   calc((var(--ax) - 70) * var(--px));
      top:    calc((var(--ay) - 78) * var(--px));
      width:  calc(140 * var(--px));
      height: calc(156 * var(--px));
      border-radius: calc(20 * var(--px));
      background-image: url(sudoku-board.png);
      background-repeat: no-repeat;
      background-size: calc(1024 * var(--px)) calc(1366 * var(--px));
      background-position: calc(var(--sx) * -1 * var(--px)) calc(var(--sy) * -1 * var(--px));
    }
    .sdk-cell.open { cursor: pointer; }
    .sdk-cell > img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .sdk-cell > img.pop { animation: sdk-pop .34s cubic-bezier(.3, 1.6, .5, 1) both; }
    @keyframes sdk-pop { from { transform: scale(1.22); } to { transform: scale(1); } }
    .sdk-cell::after {
      content: '';
      position: absolute;
      inset: calc(3 * var(--px));
      border-radius: calc(20 * var(--px));
      pointer-events: none;
      opacity: 0;
      transition: opacity .12s;
    }
    .sdk-cell.hover::after {
      opacity: 1;
      box-shadow: 0 0 0 calc(5 * var(--px)) #fdd45e, 0 0 calc(22 * var(--px)) rgb(253 212 94 / .9);
    }
    .sdk-cell.clash::after {
      box-shadow: 0 0 0 calc(6 * var(--px)) #fa6950, 0 0 calc(24 * var(--px)) rgb(250 105 80 / .8);
      animation: sdk-blink .5s ease-in-out 3;
    }
    .sdk-cell.cheer::after {
      box-shadow: 0 0 0 calc(6 * var(--px)) #fdd45e, 0 0 calc(30 * var(--px)) rgb(253 212 94 / .95);
      animation: sdk-blink .7s ease-in-out both;
      animation-delay: var(--delay);
    }
    @keyframes sdk-blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

    /* The bins in your tray: a yellow glow shows which one is picked */
    .sdk-tray {
      position: absolute;
      left:   calc(var(--x) * var(--px));
      top:    calc(var(--y) * var(--px));
      width:  calc(var(--w) * var(--px));
      height: calc(var(--h) * var(--px));
      border-radius: calc(28 * var(--px));
      touch-action: none;
    }
    .sdk-tray::after {
      content: '';
      position: absolute;
      inset: calc(6 * var(--px));
      border-radius: calc(26 * var(--px));
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 0 calc(6 * var(--px)) #fdd45e, 0 0 calc(26 * var(--px)) rgb(253 212 94 / .95);
      transition: opacity .15s;
    }
    .sdk-tray.pressed::after, .sdk-tray.selected::after { opacity: 1; }
    .sdk-tray.selected::after { animation: sdk-breathe 1.2s ease-in-out infinite; }
    @keyframes sdk-breathe { 50% { transform: scale(1.05); } }
    .sdk.hint .sdk-tray::after { animation: sdk-blink .45s ease-in-out 2; }

    /* The bin that follows your finger */
    .sdk-sprite { position: fixed; z-index: 30; pointer-events: none; }
    .sdk-sprite > img {
      display: block;
      width: 100%;
      height: 100%;
      transform: scale(1.12);
      filter: drop-shadow(0 10px 12px rgb(36 75 131 / .28));
      transition: transform .18s, filter .18s;
    }
    .sdk-sprite.landing > img { transform: scale(1); filter: none; }
    .sdk-sprite.moving { transition: left .2s ease-out, top .2s ease-out, width .2s ease-out, height .2s ease-out, opacity .2s; }
    .sdk-sprite.shake > img { animation: sdk-shake .45s ease-in-out; }
    @keyframes sdk-shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-9%) rotate(-7deg); }
      40% { transform: translateX(8%) rotate(6deg); }
      60% { transform: translateX(-6%) rotate(-4deg); }
      80% { transform: translateX(4%) rotate(3deg); }
    }


    /* ---------- Slug Says ---------- */
    /* your lit buttons fade in and out in 50 ms, like the in-between frames of your animation */
    .sim-light { opacity: 0; transition: opacity .05s linear; }
    .sim-light.on { opacity: 1; }
    .sim-pad { touch-action: none; cursor: pointer; }

    /* ---------- Battleship Ducks ---------- */
    .bs-cover { opacity: 1; transition: opacity .45s ease; }
    .bs-cover.off { opacity: 0; }
    .bs-cover.fast { transition-duration: .2s; }
    .bs-board { touch-action: none; cursor: pointer; }

    /* your crosshair, from your Battleship animation */
    .bs-aim {
      position: absolute;
      left: calc(var(--cx, 512) * var(--px));
      top: calc(var(--cy, 700) * var(--px));
      width: calc(var(--s, 82) * var(--px));
      height: calc(var(--s, 82) * var(--px));
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
    }
    .bs-aim.on { opacity: 1; }
    .bs-aim.glide { transition: opacity .15s, left .16s ease-out, top .16s ease-out, width .16s, height .16s; }
    .bs-aim.fire { animation: bs-fire .3s ease-in both; }
    @keyframes bs-fire {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      45% { transform: translate(-50%, -50%) scale(.72); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(.55); opacity: 0; }
    }
    .bs-aim.nope { animation: bs-nope .35s ease-in-out; }
    @keyframes bs-nope {
      0%, 100% { transform: translate(-50%, -50%); }
      25% { transform: translate(calc(-50% - 8 * var(--px)), -50%); }
      75% { transform: translate(calc(-50% + 8 * var(--px)), -50%); }
    }

    /* A miss leaves a little white ring on the water; a ring of water ripples out, like in your animation */
    .bs-mark, .bs-ripple {
      position: absolute;
      left: calc(var(--cx) * var(--px));
      top: calc(var(--cy) * var(--px));
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .bs-mark {
      width: calc(var(--s) * .3 * var(--px));
      height: calc(var(--s) * .3 * var(--px));
      box-shadow: inset 0 0 0 calc(4 * var(--px)) rgb(255 255 255 / .9);
      background: rgb(255 255 255 / .25);
      animation: bs-mark-in .35s .25s cubic-bezier(.3, 1.6, .5, 1) both;
    }
    @keyframes bs-mark-in { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
    .bs-ripple {
      width: calc(var(--s) * .62 * var(--px));
      height: calc(var(--s) * .62 * var(--px));
      box-shadow: inset 0 0 0 calc(4 * var(--px)) #fff;
      animation: bs-ripple .6s ease-out both;
    }
    .bs-ripple.hit { box-shadow: inset 0 0 0 calc(6 * var(--px)) #fdd45e; }
    @keyframes bs-ripple {
      0% { transform: translate(-50%, -50%) scale(.6); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }
    .bs-mark.nope { animation: bs-blink .45s ease-in-out 2; }
    @keyframes bs-blink { 50% { opacity: .2; } }

    /* FIRE! glows once a square is picked */
    .bs-fire::after {
      content: '';
      position: absolute;
      inset: calc(8 * var(--px));
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 0 calc(7 * var(--px)) #fdd45e, 0 0 calc(30 * var(--px)) rgb(253 212 94 / .95);
      transition: opacity .2s;
    }
    .bs.aimed .bs-fire::after { opacity: 1; animation: bs-breathe 1.1s ease-in-out infinite; }
    @keyframes bs-breathe { 50% { transform: scale(1.05); } }

    /* ---------- Phone turned sideways ---------- */
    .rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: var(--mint);
      color: #1f5a46;
      font: 600 17px -apple-system, system-ui, sans-serif;
      text-align: center;
    }
    .rotate p { margin: 0; }
    @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
      .rotate { display: grid; }
    }

    @media (pointer: fine) {
      .map { cursor: grab; }
      .map.dragging { cursor: grabbing; }
    }
  </style>
</head>

  <script>
    const LOADING_TIME = 1700; // one turn of your slug ring, in milliseconds

    const screens = {};
    document.querySelectorAll('.screen').forEach(s => { screens[s.id] = s; });
    const themeColor = document.querySelector('meta[name="theme-color"]');
    let current = 'splash';
    let cameFrom = 'map';
    let busy = false;

    // Fade the next screen in on top of the current one
    function show(id) {
      const prev = screens[current], next = screens[id];
      if (!next || prev === next) return;
      if (current !== 'loading') cameFrom = current;
      if (onLeave[current]) onLeave[current]();
      prev.classList.remove('active');
      prev.classList.add('leaving');
      clearTimeout(prev.leaveTimer);
      prev.leaveTimer = setTimeout(() => prev.classList.remove('leaving'), 320);
      next.classList.add('active');
      current = id;
      if (onEnter[id]) onEnter[id]();
      themeColor.setAttribute('content', next.dataset.theme);
    }

    function go(target, withLoading) {
      if (target === 'back') target = cameFrom;
      if (busy || target === current) return;
      if (!withLoading) { show(target); return; }
      busy = true;
      show('loading');
      setTimeout(() => { show(target); busy = false; }, LOADING_TIME);
    }

    document.addEventListener('click', e => {
      const button = e.target.closest('[data-go]');
      if (button) go(button.dataset.go, button.hasAttribute('data-loading'));
    });

    // ---------- Map ----------
    // It opens centred on the Slug Says label and keeps the same spot in view when the screen size changes
    const MAP_START = 994; // in pixels of the 3606 x 1846 map
    // the moving layer on the map is drawn in map pixels and scaled to the map's height on screen
    function scaleLife() {
      const el = document.getElementById('life');
      el.style.setProperty('--k', el.parentElement.clientHeight / 1846);
    }
    const scroller = document.getElementById('scroller');
    let spot = null, lastWidth = 0, lastScrollWidth = 0;
    const room = () => scroller.scrollWidth - scroller.clientWidth;
    function layoutMap() {
      if (spot === null || !lastScrollWidth) {
        const scale = scroller.clientHeight / 1846, r = room();
        spot = r > 0 ? Math.min(1, Math.max(0, (MAP_START * scale - scroller.clientWidth / 2) / r)) : 0;
      }

    // its own row and column, so a wrong colour always clashes with a bin the child can see.
    const SDK_LEVELS = [
      { puzzle: 'B.GRGRB.YG.B.BYG', solution: 'BYGRGRBYYGRBRBYG' },   // the same empty slots as your picture
      { puzzle: 'Y.BRBRYG.BR.RY..', solution: 'YGBRBRYGGBRYRYGB' },
      { puzzle: 'G..RY..B.GRYRYB.', solution: 'GBYRYRGBBGRYRYBG' },
      { puzzle: '.G.YR.G.Y.B..BYR', solution: 'BGRYRYGBYRBGGBYR' },
      { puzzle: '.YB.R..GB..Y.RG.', solution: 'GYBRRBYGBGRYYRGB' },
    ];
    const SDK_NAMES = { B: 'blue', Y: 'yellow', G: 'green', R: 'red' };
    // Where each cell's bin or slot sits in your picture (its centre, in picture pixels)
    const SDK_CENTRES = [
      [253.5, 406.5], [423, 406], [600.5, 406.5], [772, 406.5],
      [253, 580], [423, 580], [601, 580], [771, 580],
      [253.5, 765.5], [424, 765], [600, 765], [771.5, 765],
      [252.5, 943], [424, 944], [600.5, 943], [772.5, 944],
    ];
    // Which piece of your picture each kind of cell shows (top-left corner of a 140 x 156 piece)
    const SDK_SOURCE = { empty: [353, 328], B: [184, 328], Y: [530, 328], G: [702, 328], R: [353, 502] };

    const sdk = document.getElementById('sdk');
    const sdkCellsBox = document.getElementById('sdkCells');
    const sdkTray = [...sdk.querySelectorAll('.sdk-tray')];
    const sdkDots = [...document.getElementById('sdkDots').children];
    const sdkCells = SDK_CENTRES.map(([x, y], i) => {
      const el = document.createElement('div');
      el.className = 'sdk-cell';
      el.dataset.index = i;
      el.style.setProperty('--ax', x);
      el.style.setProperty('--ay', y);
      el.style.setProperty('--delay', ((i >> 2) + (i & 3)) * 70 + 'ms');
      el.addEventListener('animationend', e => { if (e.animationName === 'sdk-blink') el.classList.remove('clash'); });
      sdkCellsBox.appendChild(el);
      return el;
    });
    const game = { level: 0, puzzle: '', solution: '', board: [], won: false, selected: null, pending: new Set() };

    function sdkLoad(n) {
      const lv = SDK_LEVELS[n];
      Object.assign(game, {
        level: n, puzzle: lv.puzzle, solution: lv.solution, won: false,
        board: [...lv.puzzle].map(c => (c === '.' ? null : c)),
      });
      game.pending.clear();
      sdkSelect(null);
      sdk.classList.remove('won', 'hint');
      sdkCells.forEach((el, i) => { el.classList.remove('cheer', 'clash', 'hover'); sdkDraw(i, false); });
      document.getElementById('sdkLevelNo').textContent = n + 1;
      sdkDots.forEach((d, i) => { d.className = i < n ? 'done' : i === n ? 'now' : ''; });
    }

    function sdkDraw(i, pop) {
      const el = sdkCells[i], v = game.board[i], given = game.puzzle[i] !== '.';
      const [sx, sy] = given ? SDK_SOURCE[v] : SDK_SOURCE.empty;
      el.style.setProperty('--sx', sx);
      el.style.setProperty('--sy', sy);
      el.textContent = '';
      if (!given && v) {                       // a bin the child placed, sitting on the empty slot
        const img = document.createElement('img');
        img.src = `bin-${SDK_NAMES[v]}.png`;
        img.alt = '';
        if (pop) img.className = 'pop';
        el.appendChild(img);
      }
      el.classList.toggle('open', !v);
      el.setAttribute('role', v ? 'img' : 'button');
      el.setAttribute('aria-label', v ? `${SDK_NAMES[v]} bin` : `Empty slot, row ${(i >> 2) + 1}, column ${(i & 3) + 1}`);
    }

    function sdkSelect(color) {
      game.selected = color;
      sdkTray.forEach(b => b.classList.toggle('selected', b.dataset.color === color));
    }

    // A moving bin is the same size as a cell piece, so it lands exactly in place
    function sdkSpriteSize() {
      const s = sdk.getBoundingClientRect().width / 1024;
      return [140 * s, 156 * s];
    }
    function sdkTrayCentre(color) {
      const r = sdkTray.find(b => b.dataset.color === color).getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2];
    }
    function sdkSprite(color, cx, cy) {
      const [w, h] = sdkSpriteSize();
      const el = document.createElement('div');
      el.className = 'sdk-sprite';
      el.innerHTML = `<img src="bin-${SDK_NAMES[color]}.png" alt="">`;
      Object.assign(el.style, { width: w + 'px', height: h + 'px', left: cx - w / 2 + 'px', top: cy - h / 2 + 'px' });
      document.body.appendChild(el);
      return el;
    }
    function sdkMove(el, rect, done, extra) {
      el.classList.add('moving');
      requestAnimationFrame(() => {
        Object.assign(el.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px' }, extra || {});
      });
      setTimeout(done, 230);
    }
    function sdkSendBack(el, color) {
      const [cx, cy] = sdkTrayCentre(color), [w, h] = sdkSpriteSize();
      el.classList.remove('landing', 'shake');
      sdkMove(el, { left: cx - w / 2, top: cy - h / 2, width: w, height: h }, () => el.remove(), { opacity: '0' });
    }

    // Bins of this colour already in the same row or column
    function sdkClashes(i, color) {
      const out = [];
      for (let k = 0; k < 16; k++) {
        if (k !== i && game.board[k] === color && ((k >> 2) === (i >> 2) || (k & 3) === (i & 3))) out.push(k);
      }
      return out;
    }

    // Right colour: it drops in. Wrong colour: it wobbles, the clashing bin blinks red, and it goes back.
    function sdkTry(color, i, el) {
      if (game.won || game.board[i] || game.pending.has(i)) { sdkSendBack(el, color); return; }
      game.pending.add(i);
      el.classList.add('landing');
      sdkMove(el, sdkCells[i].getBoundingClientRect(), () => {
        game.pending.delete(i);
        if (game.solution[i] === color) {
          game.board[i] = color;
          sdkDraw(i, true);
          el.remove();
          if (game.board.every(Boolean)) sdkWin();
        } else {
          el.classList.add('shake');
          sdkClashes(i, color).forEach(k => {
            const c = sdkCells[k];
            c.classList.remove('clash');
            void c.offsetWidth;
            c.classList.add('clash');
          });
          setTimeout(() => sdkSendBack(el, color), 480);
        }
      });
    }

    function sdkWin() {
      game.won = true;
      sdkSelect(null);
      const last = game.level === SDK_LEVELS.length - 1;
      sdkDots[game.level].className = 'done';
      sdkCells.forEach(c => { c.classList.remove('cheer'); void c.offsetWidth; c.classList.add('cheer'); });
      document.getElementById('sdkCardTitle').textContent = last ? 'You did it!' : 'Great job!';
      document.getElementById('sdkCardText').textContent = last ? 'You finished all 5 levels.' : `Level ${game.level + 1} is done.`;
      document.getElementById('sdkCardButtonText').textContent = last ? 'Play again' : 'Next level';
      setTimeout(() => { if (game.won) sdk.classList.add('won'); }, 900);
    }
    document.getElementById('sdkCardButton').addEventListener('click', () => {
      if (game.won) sdkLoad(game.level === SDK_LEVELS.length - 1 ? 0 : game.level + 1);
    });

    // Drag a bin from the tray, or tap it to pick it (tap it again to put it back)
    let sdkDrag = null;
    sdkTray.forEach(btn => {
      btn.addEventListener('pointerdown', e => {
        if (game.won || sdkDrag || (e.pointerType === 'mouse' && e.button !== 0)) return;
        e.preventDefault();
        try { btn.setPointerCapture(e.pointerId); } catch (err) { /* keep going without capture */ }
        btn.classList.add('pressed');
        sdkDrag = { btn, color: btn.dataset.color, id: e.pointerId, x0: e.clientX, y0: e.clientY,
                    sprite: null, over: null, lift: e.pointerType === 'touch' ? 0.38 : 0 };
      });
      btn.addEventListener('pointermove', e => {
        const d = sdkDrag;
        if (!d || e.pointerId !== d.id) return;
        if (!d.sprite) {
          if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 8) return;
          sdkSelect(null);
          d.sprite = sdkSprite(d.color, ...sdkTrayCentre(d.color));
        }
        const [w, h] = sdkSpriteSize();
        const cx = e.clientX, cy = e.clientY - d.lift * h;   // on a finger, the bin rides just above it
        d.sprite.style.left = cx - w / 2 + 'px';
        d.sprite.style.top = cy - h / 2 + 'px';
        const hit = document.elementFromPoint(cx, cy);
        const cell = hit && hit.closest('.sdk-cell.open');
        if (cell !== d.over) {
          if (d.over) d.over.classList.remove('hover');
          if (cell) cell.classList.add('hover');
          d.over = cell;
        }
      });
      const end = (e, cancelled) => {
        const d = sdkDrag;
        if (!d || e.pointerId !== d.id) return;
        sdkDrag = null;
        d.btn.classList.remove('pressed');
        if (d.over) d.over.classList.remove('hover');
        if (!d.sprite) {
          if (!cancelled) sdkSelect(game.selected === d.color ? null : d.color);
          return;
        }
        if (d.over && !cancelled) sdkTry(d.color, +d.over.dataset.index, d.sprite);
        else sdkSendBack(d.sprite, d.color);
      };
      btn.addEventListener('pointerup', e => end(e, false));
      btn.addEventListener('pointercancel', e => end(e, true));
    });

    // Tapping an empty slot sends the picked bin there; with nothing picked, the tray blinks as a hint
    sdkCellsBox.addEventListener('click', e => {
      const cell = e.target.closest('.sdk-cell');
      if (!cell || game.won || !cell.classList.contains('open')) return;
      if (!game.selected) {
        sdk.classList.remove('hint');
        void sdk.offsetWidth;
        sdk.classList.add('hint');
        return;
      }
      const color = game.selected;
      sdkSelect(null);
      sdkTry(color, +cell.dataset.index, sdkSprite(color, ...sdkTrayCentre(color)));
    });
    sdk.addEventListener('contextmenu', e => e.preventDefault());

    sdkLoad(0);

    // ---------- Shared bits for Slug Says and Battleship Ducks ----------
    // A message in the level pill; it pops a little each time it changes
    function say(el, text) {
      if (el.textContent === text) return;
      el.textContent = text;
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
    function shake(el) {
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
    }
    // Timers that belong to one game, so leaving the screen can stop them all at once
    function timerBox() {
      const ids = new Set();
      return {
        later(fn, ms) { const id = setTimeout(() => { ids.delete(id); fn(); }, ms); ids.add(id); return id; },
        clear() { ids.forEach(clearTimeout); ids.clear(); },
      };
    }
    function setDots(dots, level) {
      dots.forEach((d, i) => { d.className = i < level ? 'done' : i === level ? 'now' : ''; });
    }

    // ---------- Slug Says ----------
    // Each level has 3 rounds. Every round repeats the lights so far and adds one more.
    // Level 1 uses the timing of your own animation: a light stays on for half a second, with a short pause in between.
    const SIM_LEVELS = [
      { first: 1, rounds: 3, on: 500, gap: 200 },   // 1, then 2, then 3 lights
      { first: 2, rounds: 3, on: 420, gap: 170 },   // 2, 3, 4
      { first: 3, rounds: 3, on: 350, gap: 150 },   // 3, 4, 5
    ];
    const SIM_COLORS = ['green', 'red', 'yellow', 'blue'];
    // Your pad in picture pixels: its oval, the dark middle, and where the four colours meet
    const SIM_PAD = { cx: 1025, cy: 2288, rx: 505, ry: 330, hubX: 1028, hubY: 2262, hubRx: 118, hubRy: 74, splitX: 1030, splitY: 2257 };

    const simStage = document.getElementById('sim');
    const simPad = document.getElementById('simPad');
    const simSay = document.getElementById('simSay');
    const simPill = document.getElementById('simPill');
    const simDots = [...document.getElementById('simDots').children];
    const simLights = {};
    simStage.querySelectorAll('.sim-light').forEach(img => { simLights[img.dataset.color] = img; });
    const simTimers = timerBox();
    const simon = { level: 0, round: 0, seq: [], pos: 0, state: 'ready' };

    function simRandomColor(seq) {
      let c;
      do { c = SIM_COLORS[Math.floor(Math.random() * 4)]; }
      while (seq.length >= 2 && seq[seq.length - 1] === c && seq[seq.length - 2] === c);   // never 3 the same in a row
      return c;
    }
    function simAllOff() { Object.values(simLights).forEach(l => l.classList.remove('on')); }
    function simFlash(color, ms) {
      simLights[color].classList.add('on');
      simTimers.later(() => simLights[color].classList.remove('on'), ms);
    }
    function simCard(title, text, button) {
      document.getElementById('simCardTitle').textContent = title;
      document.getElementById('simCardText').textContent = text;
      document.getElementById('simCardButtonText').textContent = button;
      simStage.classList.add('won');
    }

    function simLoad(n) {
      simTimers.clear();
      simAllOff();
      const lv = SIM_LEVELS[n];
      simon.level = n;
      simon.round = 0;
      simon.seq = [];
      while (simon.seq.length < lv.first) simon.seq.push(simRandomColor(simon.seq));
      simon.pos = 0;
      simon.state = 'ready';
      document.getElementById('simLevelNo').textContent = n + 1;
      setDots(simDots, n);
      simSay.textContent = '';
    }
    function simStart() {
      simStage.classList.remove('won');
      simon.state = 'watch';
      say(simSay, 'Watch!');
      simTimers.later(simPlay, 700);
    }
    // Light the sequence, then hand over to the child
    function simPlay() {
      const lv = SIM_LEVELS[simon.level];
      simon.state = 'watch';
      simon.pos = 0;
      say(simSay, 'Watch!');
      let t = 0;
      simon.seq.forEach(color => {
        simTimers.later(() => simFlash(color, lv.on), t);
        t += lv.on + 50 + lv.gap;
      });
      simTimers.later(() => { simon.state = 'turn'; say(simSay, 'Your turn!'); }, t);
    }
    function simPress(color) {
      if (simon.state !== 'turn') {
        if (simon.state === 'watch') shake(simPill);
        return;
      }
      if (color !== simon.seq[simon.pos]) {
        simon.state = 'oops';
        say(simSay, 'Oops! Watch again.');
        shake(simPill);
        simTimers.later(simPlay, 1500);
        return;
      }
      simon.pos++;
      if (simon.pos < simon.seq.length) return;
      // the whole sequence is right
      if (simon.round < SIM_LEVELS[simon.level].rounds - 1) {
        simon.state = 'good';
        say(simSay, simon.round === 0 ? 'Yes!' : 'Great!');
        simTimers.later(() => {
          simon.round++;
          simon.seq.push(simRandomColor(simon.seq));
          simPlay();
        }, 1100);
      } else {
        simWin();
      }
    }
    // Level done: all four buttons flash twice, like the end of your animation
    function simWin() {
      simon.state = 'won';
      say(simSay, 'Well done!');
      const all = simLights.all;
      [450, 800].forEach(t => {
        simTimers.later(() => all.classList.add('on'), t);
        simTimers.later(() => all.classList.remove('on'), t + 200);
      });
      simDots[simon.level].className = 'done';
      const last = simon.level === SIM_LEVELS.length - 1;
      simTimers.later(() => simCard(
        last ? 'You did it!' : 'Great job!',
        last ? 'You finished all 3 levels.' : `Level ${simon.level + 1} is done.`,
        last ? 'Play again' : 'Next level'), 1400);
    }
    document.getElementById('simCardButton').addEventListener('click', () => {
      if (simon.state === 'won') simLoad(simon.level === SIM_LEVELS.length - 1 ? 0 : simon.level + 1);
      if (simon.state === 'ready') simStart();
    });

    // Which colour is under the finger (in picture pixels), or none
    function simColorAt(clientX, clientY) {
      const r = simStage.getBoundingClientRect();
      const x = (clientX - r.left) / r.width * 2048, y = (clientY - r.top) / r.width * 2048;
      const p = SIM_PAD;
      if (((x - p.cx) / p.rx) ** 2 + ((y - p.cy) / p.ry) ** 2 > 1) return null;
      if (((x - p.hubX) / p.hubRx) ** 2 + ((y - p.hubY) / p.hubRy) ** 2 < 1) return null;
      if (y < p.splitY) return x < p.splitX ? 'green' : 'red';
      return x < p.splitX ? 'yellow' : 'blue';
    }
    // A button lights while it is pressed (at least a quarter of a second)
    const simHeld = new Map();
    simPad.addEventListener('pointerdown', e => {
      e.preventDefault();
      const color = simColorAt(e.clientX, e.clientY);
      if (!color) return;
      if (simon.state === 'turn') {
        simLights[color].classList.add('on');
        simHeld.set(e.pointerId, { color, since: performance.now() });
      }
      simPress(color);
    });
    const simRelease = e => {
      const held = simHeld.get(e.pointerId);
      if (!held) return;
      simHeld.delete(e.pointerId);
      const wait = Math.max(0, 250 - (performance.now() - held.since));
      simTimers.later(() => {
        if (![...simHeld.values()].some(h => h.color === held.color)) simLights[held.color].classList.remove('on');
      }, wait);
    };
    simPad.addEventListener('pointerup', simRelease);
    simPad.addEventListener('pointercancel', simRelease);
    simPad.addEventListener('pointerleave', simRelease);
    simStage.addEventListener('contextmenu', e => e.preventDefault());

    // Leaving in the middle of a round: the round starts again from the card when you come back
    function simPause() {
      simTimers.clear();
      simHeld.clear();
      simAllOff();
      if (['watch', 'turn', 'good', 'oops'].includes(simon.state)) {
        simon.state = 'ready';
        simon.pos = 0;
        simSay.textContent = '';
        simCard(`Level ${simon.level + 1}`, 'Ready? Watch the buttons again, then tap them in the same order.', 'Start');
      }
      if (simon.state === 'won' && !simStage.classList.contains('won')) {
        // the level was finished just before leaving: show its card straight away
        const last = simon.level === SIM_LEVELS.length - 1;
        simCard(last ? 'You did it!' : 'Great job!', last ? 'You finished all 3 levels.' : `Level ${simon.level + 1} is done.`, last ? 'Play again' : 'Next level');
      }
    }

    simLoad(0);
    simCard('Level 1', 'Watch the buttons light up. Then tap them in the same order.', 'Start');

    // ---------- Battleship Ducks ----------
    // Look first, then find: the ducks show for a few seconds, then hide under the water.
    // Tap a square to aim, press FIRE! A hit brings that duck back up; a miss leaves a little ring.
    // Set look to 0 for classic Battleship (no peeking at the start).
    const BS_LEVELS = [
      { ships: [0, 4],          look: 5 },   // 2 ships, 6 ducks
      { ships: [1, 2, 3],       look: 5 },   // 3 ships, 7 ducks
      { ships: [0, 1, 2, 3, 4], look: 7 },   // all 5 ships, 13 ducks
    ];
    const BS_PEEK_AFTER = 3;   // misses in a row before the ducks peek out for a moment
    // Your board's grid in picture pixels: the y of each row line, and each column line as x = a + b * y
    const BS_ROWS = [411, 469, 524, 581, 640, 700, 761, 823, 886, 950, 1022];
    const BS_COLS = [[238.03, -0.06075], [292.3, -0.04341], [352.52, -0.0308], [409.86, -0.02023], [466.15, -0.00702],
                     [524.36, 0.00332], [583.11, 0.01332], [640.92, 0.02351], [699.74, 0.03583], [755.76, 0.05239], [815.4, 0.06609]];
    // Your ducks: which ship, where its water cover goes, and which squares count as that duck (row, column)
    const BS_DUCKS = [
      { ship: 0, box: [565, 441, 87, 123],  cells: [[1, 6]] },
      { ship: 0, box: [650, 441, 62, 123],  cells: [[1, 7]] },
      { ship: 0, box: [710, 441, 62, 123],  cells: [[1, 8]] },
      { ship: 0, box: [770, 441, 83, 123],  cells: [[1, 9]] },
      { ship: 1, box: [242, 545, 115, 86],  cells: [[3, 1]] },
      { ship: 1, box: [242, 629, 115, 54],  cells: [[4, 1]] },
      { ship: 1, box: [242, 681, 115, 84],  cells: [[5, 1]] },
      { ship: 2, box: [711, 802, 116, 88],  cells: [[7, 8]] },
      { ship: 2, box: [711, 888, 116, 87],  cells: [[8, 8]] },
      { ship: 3, box: [565, 623, 88, 124],  cells: [[4, 6], [5, 6]] },
      { ship: 3, box: [651, 623, 89, 124],  cells: [[4, 7], [5, 7]] },
      { ship: 4, box: [230, 878, 88, 126],  cells: [[8, 1], [9, 1]] },
      { ship: 4, box: [316, 878, 89, 126],  cells: [[8, 2], [9, 2]] },
    ];
    const BS_FILES = ['1-1', '1-2', '1-3', '1-4', '2-1', '2-2', '2-3', '3-1', '3-2', '4-1', '4-2', '5-1', '5-2'];

    const bsStage = document.getElementById('bs');
    const bsSay = document.getElementById('bsSay');
    const bsPill = document.getElementById('bsPill');
    const bsAim = document.getElementById('bsAim');
    const bsMarks = document.getElementById('bsMarks');
    const bsDots = [...document.getElementById('bsDots').children];
    const bsTimers = timerBox();
    const bsCovers = BS_DUCKS.map((d, i) => {
      const img = document.createElement('img');
      img.className = 'part bs-cover';
      img.src = `duck-cover-${BS_FILES[i]}.png`;
      img.alt = '';
      const [x, y, w, h] = d.box;
      img.setAttribute('style', `--x:${x}; --y:${y}; --w:${w}; --h:${h}; --r:0`);
      document.getElementById('bsCovers').appendChild(img);
      return img;
    });
    const bsKey = (r, c) => r * 10 + c;
    const bsOwner = new Map();   // square -> duck
    BS_DUCKS.forEach((d, i) => d.cells.forEach(([r, c]) => bsOwner.set(bsKey(r, c), i)));
    const bs = { level: 0, state: 'ready', ducks: [], found: new Set(), shots: new Map(), aim: null, misses: 0 };

    // The four corners of a square, its middle, and how big the crosshair should be there
    function bsCorner(c, r) { return [BS_COLS[c][0] + BS_COLS[c][1] * BS_ROWS[r], BS_ROWS[r]]; }
    function bsSquare(r, c) {
      const p = [bsCorner(c, r), bsCorner(c + 1, r), bsCorner(c + 1, r + 1), bsCorner(c, r + 1)];
      const cx = (p[0][0] + p[1][0] + p[2][0] + p[3][0]) / 4, cy = (p[0][1] + p[2][1]) / 2;
      const w = ((p[1][0] - p[0][0]) + (p[2][0] - p[3][0])) / 2, h = p[3][1] - p[0][1];
      return { cx, cy, s: 82 * Math.sqrt(w * h / (64.5 * 59)) };   // your crosshair is 82 px on square E4
    }
    function bsSquareAt(x, y) {
      let r = -1;
      for (let i = 0; i < 10; i++) if (y >= BS_ROWS[i] && y < BS_ROWS[i + 1]) r = i;
      if (r < 0) return null;
      for (let c = 0; c < 10; c++) {
        const x0 = BS_COLS[c][0] + BS_COLS[c][1] * y, x1 = BS_COLS[c + 1][0] + BS_COLS[c + 1][1] * y;
        if (x >= x0 && x < x1) return [r, c];
      }
      return null;
    }
    function bsCount() { return `${bs.found.size} of ${bs.ducks.length} ducks`; }
    function bsCard(title, text, button) {
      document.getElementById('bsCardTitle').textContent = title;
      document.getElementById('bsCardText').textContent = text;
      document.getElementById('bsCardButtonText').textContent = button;
      bsStage.classList.add('won');
    }
    function bsSetAim(sq) {
      bs.aim = sq;
      bsStage.classList.toggle('aimed', !!sq);
      if (!sq) { bsAim.classList.remove('on', 'glide'); return; }
      const { cx, cy, s } = bsSquare(...sq);
      const wasOn = bsAim.classList.contains('on');
      bsAim.classList.remove('fire', 'nope');
      bsAim.classList.toggle('glide', wasOn);
      bsAim.style.setProperty('--cx', cx);
      bsAim.style.setProperty('--cy', cy);
      bsAim.style.setProperty('--s', s);
      bsAim.classList.add('on');
    }

    function bsLoad(n) {
      bsTimers.clear();
      const lv = BS_LEVELS[n];
      Object.assign(bs, { level: n, state: 'ready', misses: 0 });
      bs.ducks = BS_DUCKS.map((d, i) => i).filter(i => lv.ships.includes(BS_DUCKS[i].ship));
      bs.found.clear();
      bs.shots.clear();
      bsSetAim(null);
      bsMarks.textContent = '';
      bsCovers.forEach(c => c.classList.remove('off', 'fast'));
      document.getElementById('bsLevelNo').textContent = n + 1;
      setDots(bsDots, n);
      bsSay.textContent = '';
    }
    function bsStart() {
      bsStage.classList.remove('won');
      const lv = BS_LEVELS[bs.level];
      if (!lv.look) { bsHide(); return; }
      bs.state = 'look';
      bs.ducks.forEach(i => bsCovers[i].classList.add('off'));
      for (let k = lv.look; k > 0; k--) bsTimers.later(() => say(bsSay, `Remember the ducks! ${k}`), (lv.look - k) * 1000);
      bsTimers.later(bsHide, lv.look * 1000);
    }
    function bsHide() {
      bs.ducks.forEach(i => { if (!bs.found.has(i)) bsCovers[i].classList.remove('off'); });
      bs.state = 'play';
      say(bsSay, 'Find the ducks!');
    }

    function bsTap(clientX, clientY) {
      if (bs.state !== 'play') return;
      const r = bsStage.getBoundingClientRect();
      const sq = bsSquareAt((clientX - r.left) / r.width * 1024, (clientY - r.top) / r.width * 1024);
      if (!sq) return;
      const key = bsKey(...sq);
      if (bs.shots.has(key)) {
        say(bsSay, 'You tried there already');
        const mark = bsMarks.querySelector(`[data-key="${key}"]`);
        if (mark) { mark.classList.remove('nope'); void mark.offsetWidth; mark.classList.add('nope'); }
        return;
      }
      bsSetAim(sq);
      say(bsSay, 'Now press FIRE!');
    }
    function bsFire() {
      if (bs.state !== 'play') return;
      if (!bs.aim) { say(bsSay, 'Tap a square first'); shake(bsPill); return; }
      const [r, c] = bs.aim, key = bsKey(r, c), sq = bsSquare(r, c);
      bsSetAim(null);
      bsAim.classList.add('on', 'fire');
      bs.state = 'shot';
      bsTimers.later(() => {
        bsAim.classList.remove('on', 'fire');
        bs.state = 'play';
        const duck = bsOwner.get(key);
        const ripple = document.createElement('div');
        ripple.className = 'bs-ripple';
        ripple.style.cssText = `--cx:${sq.cx}; --cy:${sq.cy}; --s:${sq.s}`;
        ripple.addEventListener('animationend', () => ripple.remove());
        if (duck !== undefined && bs.ducks.includes(duck) && !bs.found.has(duck)) {
          // hit: the duck comes back up, and every square of that duck counts as found
          bs.found.add(duck);
          BS_DUCKS[duck].cells.forEach(([rr, cc]) => bs.shots.set(bsKey(rr, cc), 'hit'));
          bsCovers[duck].classList.add('off');
          ripple.classList.add('hit');
          bsMarks.appendChild(ripple);
          bs.misses = 0;
          const ship = BS_DUCKS[duck].ship;
          const shipDone = bs.ducks.filter(i => BS_DUCKS[i].ship === ship).every(i => bs.found.has(i));
          if (bs.found.size === bs.ducks.length) { bsWin(); return; }
          say(bsSay, shipDone ? `A whole ship! ${bsCount()}` : `Hit! ${bsCount()}`);
        } else {
          // miss: a ring on the water
          bs.shots.set(key, 'miss');
          bsMarks.appendChild(ripple);
          const mark = document.createElement('div');
          mark.className = 'bs-mark';
          mark.dataset.key = key;
          mark.style.cssText = `--cx:${sq.cx}; --cy:${sq.cy}; --s:${sq.s}`;
          bsMarks.appendChild(mark);
          bs.misses++;
          if (bs.misses >= BS_PEEK_AFTER) { bs.misses = 0; bsPeek(); }
          else say(bsSay, `Splash! ${bsCount()}`);
        }
      }, 280);
    }
    // After a few misses in a row, the ducks that are still hiding peek out for a moment
    function bsPeek() {
      say(bsSay, 'Splash! Peek at the ducks!');
      bs.state = 'peek';
      const hiding = bs.ducks.filter(i => !bs.found.has(i));
      bsTimers.later(() => hiding.forEach(i => bsCovers[i].classList.add('off', 'fast')), 500);
      bsTimers.later(() => {
        hiding.forEach(i => { if (!bs.found.has(i)) bsCovers[i].classList.remove('off'); });
        bs.state = 'play';
        say(bsSay, 'Find the ducks!');
      }, 1900);
      bsTimers.later(() => hiding.forEach(i => bsCovers[i].classList.remove('fast')), 2400);
    }
    function bsWin() {
      bs.state = 'won';
      say(bsSay, 'You found them all!');
      bsDots[bs.level].className = 'done';
      const last = bs.level === BS_LEVELS.length - 1;
      bsTimers.later(() => bsCard(
        last ? 'You did it!' : 'Great job!',
        last ? 'You found every duck in all 3 levels.' : `You found all ${bs.ducks.length} ducks.`,
        last ? 'Play again' : 'Next level'), 1200);
    }
    document.getElementById('bsCardButton').addEventListener('click', () => {
      if (bs.state === 'won') bsLoad(bs.level === BS_LEVELS.length - 1 ? 0 : bs.level + 1);
      if (bs.state === 'ready') bsStart();
    });
    document.getElementById('bsBoard').addEventListener('pointerdown', e => { e.preventDefault(); bsTap(e.clientX, e.clientY); });
    document.getElementById('bsFire').addEventListener('click', bsFire);
    bsStage.addEventListener('contextmenu', e => e.preventDefault());

    // Leaving while the ducks are showing: they hide again, and the level starts from its card
    function bsPause() {
      if (bs.state === 'look') {
        bsTimers.clear();
        bsCovers.forEach(c => c.classList.remove('off'));
        bs.state = 'ready';
        bsSay.textContent = '';
        bsCard(`Level ${bs.level + 1}`, 'Look where the ducks are. Then find them all!', 'Start');
      } else if (bs.state === 'peek' || bs.state === 'shot') {
        bsTimers.clear();
        bs.ducks.forEach(i => bsCovers[i].classList.toggle('off', bs.found.has(i)));
        bsAim.classList.remove('on', 'fire');
        bs.state = 'play';
        bsSay.textContent = '';
      } else if (bs.state === 'won' && !bsStage.classList.contains('won')) {
        bsTimers.clear();
        const last = bs.level === BS_LEVELS.length - 1;
        bsCard(last ? 'You did it!' : 'Great job!', last ? 'You found every duck in all 3 levels.' : `You found all ${bs.ducks.length} ducks.`, last ? 'Play again' : 'Next level');
      }
    }

    bsLoad(0);
    bsCard('Level 1', 'Look where the ducks are. Then find them all!', 'Start');

    // Games pause when you leave their screen or the app goes to the background
    const onLeave = { simon: simPause, battle: bsPause, map: lifeStop };
    const onEnter = { map: lifeStart };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && onLeave[current]) onLeave[current]();
    });

    // Stop a pinch from zooming the whole app
    for (const type of ['gesturestart', 'gesturechange']) {
      document.addEventListener(type, e => e.preventDefault(), { passive: false });
    }

    // Lets the app open without internet (see sw.js)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
